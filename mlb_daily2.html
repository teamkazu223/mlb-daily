<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 第一優先級：iOS 獨立 App 宣告 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MLB Monitor">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MLB Gameday Monitor v1.2</title>

    <!-- iOS 圖示 -->
    <link rel="apple-touch-icon" href="https://teamkazu223.github.io/mlb-daily/img/mlb.png">
    
    <!-- Web App Manifest (Data URI) - 修正啟動路徑 -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"MLB Gameday Monitor","short_name":"MLB Monitor","start_url":"index.html","display":"standalone","background_color":"#0a1118","theme_color":"#0a1118","scope":"/","icons":[{"src":"https://teamkazu223.github.io/mlb-daily/img/mlb.png","sizes":"192x192","type":"image/png"},{"src":"https://teamkazu223.github.io/mlb-daily/img/mlb.png","sizes":"512x512","type":"image/png"}]}'>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0a1118;
            --tab-height: 65px;
            --safe-bottom: env(safe-area-inset-bottom);
            --safe-top: env(safe-area-inset-top);
        }
        
        /* 移除 iOS 橡皮筋回彈與捲動條 */
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
        }

        /* 版本號標記 */
        .version-tag {
            position: absolute;
            top: calc(10px + var(--safe-top));
            left: 15px;
            font-size: 10px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.2);
            z-index: 50;
            pointer-events: none;
        }

        /* 頂部 Header */
        header {
            background: linear-gradient(180deg, #141f2a 0%, #0a1118 100%);
            padding-top: calc(1.5rem + var(--safe-top));
            padding-bottom: 1.5rem;
            text-align: center;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 主滾動區域 */
        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 1rem;
        }

        /* 底部頁籤：完全貼齊且支援 Safe Area */
        .tab-bar {
            flex-shrink: 0;
            height: calc(var(--tab-height) + var(--safe-bottom));
            background: rgba(20, 31, 42, 0.98);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid #2d3d4d;
            display: flex;
            justify-content: space-around;
            padding-bottom: var(--safe-bottom);
            z-index: 1000;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #64748b;
            background: none;
            border: none;
            width: 50%;
        }
        .tab-item.active { color: #3b82f6; }
        .tab-item i { font-size: 20px; }
        .tab-item span { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; }

        .card-dark { background-color: #1a2634; border: 1px solid #2d3d4d; border-radius: 1.25rem; padding: 1.25rem; margin-bottom: 1rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; padding-top: 10px; border-top: 1px solid #2d3d4d; margin-top: 10px; }
        .season-stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; padding-top: 10px; border-top: 1px solid #2d3d4d; margin-top: 10px; }
        
        .live-dot { width: 6px; height: 6px; background-color: #ef4444; border-radius: 50%; display: inline-block; margin-right: 4px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .schedule-row {
            display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 12px;
            background: rgba(26, 38, 52, 0.7); border: 1px solid #2d3d4d; margin-bottom: 8px;
        }

        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0a1118; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000;
        }
        .baseball-spinner { width: 50px; height: 50px; background-color: #3b82f6; border-radius: 50%; position: relative; animation: spin 2s linear infinite; }
        .baseball-spinner::before, .baseball-spinner::after { content: ''; position: absolute; width: 40px; height: 40px; border: 3.5px solid #0a1118; border-radius: 50%; }
        .baseball-spinner::before { top: -24px; left: 5px; }
        .baseball-spinner::after { bottom: -24px; right: -10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { color: #81b3ff; font-weight: 900; font-size: 13px; letter-spacing: 0.25em; margin-top: 20px; }

        .division-header { background: rgba(59, 130, 246, 0.15); color: #3b82f6; font-weight: 900; padding: 10px 14px; border-radius: 8px; margin: 15px 0 10px 0; font-size: 11px; }
        .standing-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .standing-table td { padding: 10px 4px; border-bottom: 1px solid #1e293b; }

        .bottom-spacer { height: 40px; }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="baseball-spinner"></div>
        <p class="loader-text">SYNCHRONIZING DATA...</p>
    </div>

    <div class="version-tag">v1.2</div>

    <header>
        <div class="flex justify-center mb-6">
            <img src="https://www.mlbstatic.com/team-logos/league-on-dark/1.svg" class="h-10" alt="MLB">
        </div>
        <div id="header-controls" class="px-4">
            <div class="flex gap-2">
                <input type="date" id="target-date" class="flex-1 bg-[#1a2634] border border-white/10 rounded-2xl p-4 text-white font-bold outline-none" onchange="handleDateChange()">
                <button onclick="handleManualRefresh()" class="w-16 bg-[#1a2634] border border-white/10 rounded-2xl flex items-center justify-center active:scale-90">
                    <i class="fas fa-sync-alt text-lg text-blue-400"></i>
                </button>
            </div>
        </div>
        <div id="header-season-title" class="hidden py-2 text-blue-400 font-black uppercase tracking-tighter">Season Stats 2026</div>
    </header>

    <main id="scroll-area">
        <div id="tab-content-daily">
            <section class="mt-6 mb-8">
                <h2 class="font-black text-sm tracking-widest uppercase mb-4 text-slate-400">Schedule 重點賽程</h2>
                <div id="schedule-list" class="space-y-2"></div>
            </section>
            <section class="mb-8">
                <h2 class="font-black text-sm tracking-widest uppercase mb-4 text-slate-400">Batters 打者成績</h2>
                <div id="batter-list" class="space-y-4"></div>
            </section>
            <section class="mb-8">
                <h2 class="font-black text-sm tracking-widest uppercase mb-4 text-slate-400">Pitchers 投手成績</h2>
                <div id="pitcher-list" class="space-y-4"></div>
            </section>
            <div class="bottom-spacer"></div>
        </div>

        <div id="tab-content-season" class="hidden">
            <section class="mt-6 mb-8">
                <h2 class="font-black text-sm tracking-widest uppercase mb-4 text-blue-400">Accumulated 賽季累積</h2>
                <div id="season-stats-list" class="space-y-4"></div>
            </section>
            <section class="mb-8">
                <h2 class="font-black text-sm tracking-widest uppercase mb-4 text-slate-400">Standings 分區排名</h2>
                <div class="card-dark overflow-hidden">
                    <div class="flex gap-2 mb-4">
                        <button onclick="renderLeagueStandings('103')" id="btn-al" class="flex-1 py-2 rounded-xl bg-blue-600/20 text-blue-400 text-[10px] font-black tracking-widest border border-blue-500/30">AMERICAN</button>
                        <button onclick="renderLeagueStandings('104')" id="btn-nl" class="flex-1 py-2 rounded-xl bg-slate-800 text-slate-500 text-[10px] font-black tracking-widest">NATIONAL</button>
                    </div>
                    <div id="standings-container"></div>
                </div>
            </section>
            <div class="bottom-spacer"></div>
        </div>
    </main>

    <nav class="tab-bar">
        <button onclick="switchTab('daily')" id="nav-daily" class="tab-item active">
            <i class="fas fa-baseball-bat-ball"></i>
            <span>Daily</span>
        </button>
        <button onclick="switchTab('season')" id="nav-season" class="tab-item">
            <i class="fas fa-chart-line"></i>
            <span>Season</span>
        </button>
    </nav>

    <script>
        const SCHEDULE_FILTER_TEAMS = [119, 117, 116];
        const PRIORITY_TEAMS = [119, 117, 116, 137]; 
        const PLAYERS = {
            batters: [
                { id: 660271, name: '大谷翔平', teamHint: 119, pos: 'DH', img: 'https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_213,q_auto:best/v1/people/660271/headshot/67/current' },
                { id: 701678, name: '李灝宇', teamHint: 116, pos: '2B', img: 'https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_213,q_auto:best/v1/people/701678/headshot/67/current' }
            ],
            pitchers: [
                { id: 660271, name: '大谷翔平', teamHint: 119, img: 'https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_213,q_auto:best/v1/people/660271/headshot/67/current' },
                { id: 808967, name: '山本由伸', teamHint: 119, img: 'https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_213,q_auto:best/v1/people/808967/headshot/67/current' },
                { id: 678906, name: '鄧愷威', teamHint: 117, img: 'https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_213,q_auto:best/v1/people/678906/headshot/67/current' }
            ]
        };
        const TEAM_MAP = { 108: '天使', 109: '響尾蛇', 110: '金鶯', 111: '紅襪', 112: '小熊', 113: '紅人', 114: '守護者', 115: '落磯', 116: '老虎', 117: '太空人', 118: '皇家', 119: '道奇', 120: '國民', 121: '大都會', 133: '運動家', 134: '海盜', 135: '教士', 136: '水手', 137: '巨人', 138: '紅雀', 139: '光芒', 140: '遊騎兵', 141: '藍鳥', 142: '雙城', 143: '費城人', 144: '勇士', 145: '白襪', 146: '馬林魚', 147: '洋基', 158: '釀酒人' };

        let dailyGames = []; let currentTab = 'daily'; let seasonDataLoaded = false; let standingsData = null;

        function init() {
            const now = new Date();
            const today = now.toISOString().split('T')[0];
            document.getElementById('target-date').value = today;
            fetchDailyData();
        }

        async function switchTab(tabName) {
            if (currentTab === tabName) return;
            currentTab = tabName;
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${tabName}`).classList.add('active');
            document.getElementById('tab-content-daily').classList.toggle('hidden', tabName !== 'daily');
            document.getElementById('tab-content-season').classList.toggle('hidden', tabName !== 'season');
            document.getElementById('header-controls').classList.toggle('hidden', tabName !== 'daily');
            document.getElementById('header-season-title').classList.toggle('hidden', tabName !== 'season');

            if (tabName === 'season' && !seasonDataLoaded) await fetchSeasonData();
            document.getElementById('scroll-area').scrollTop = 0;
        }

        function toggleLoader(show) {
            const loader = document.getElementById('loader-overlay');
            loader.style.display = show ? 'flex' : 'none';
        }

        async function fetchDailyData() {
            toggleLoader(true);
            const date = document.getElementById('target-date').value;
            try {
                await fetchSchedule(date);
                await fetchPlayerStats();
            } catch (e) { console.error(e); }
            finally { setTimeout(() => toggleLoader(false), 500); }
        }

        async function fetchSeasonData() {
            toggleLoader(true);
            try {
                await Promise.all([fetchSeasonOverview(), fetchStandings()]);
                seasonDataLoaded = true;
                renderLeagueStandings('103'); 
            } catch (e) { console.error(e); }
            finally { toggleLoader(false); }
        }

        window.handleDateChange = fetchDailyData;
        window.handleManualRefresh = () => { if (currentTab === 'daily') fetchDailyData(); else fetchSeasonData(); };

        async function fetchSchedule(date) {
            try {
                const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${date}&hydrate=linescore`);
                const data = await res.json();
                const list = document.getElementById('schedule-list');
                dailyGames = [];
                if (!data.dates?.[0]) { list.innerHTML = `<div class="text-slate-600 text-xs text-center py-4">本日無賽程</div>`; return; }
                const games = data.dates[0].games;
                games.forEach(g => dailyGames.push(g.gamePk));
                const filtered = games.filter(g => SCHEDULE_FILTER_TEAMS.includes(g.teams.away.team.id) || SCHEDULE_FILTER_TEAMS.includes(g.teams.home.team.id));
                list.innerHTML = filtered.map(g => {
                    const status = g.status.abstractGameState;
                    const time = new Date(g.gameDate).toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', timeZone: 'America/New_York' });
                    let sub = status;
                    if (status === 'Live' && g.linescore) sub = `<span class="text-red-500 font-bold">${g.linescore.inningState || ""} ${g.linescore.currentInningOrdinal || ""}</span>`;
                    return `<div class="schedule-row">
                        <div class="text-[9px] font-black"><div class="text-slate-400">${time}</div><div>${sub}</div></div>
                        <div class="flex-1 flex items-center justify-center gap-4 px-4">
                            <div class="flex items-center gap-2 flex-1 justify-end"><span class="text-xs font-bold">${TEAM_MAP[g.teams.away.team.id] || '---'}</span><img src="https://www.mlbstatic.com/team-logos/${g.teams.away.team.id}.svg" class="w-5 h-5"><span class="font-black">${g.teams.away.score ?? 0}</span></div>
                            <span class="text-[9px] text-slate-600">vs</span>
                            <div class="flex items-center gap-2 flex-1 justify-start"><span class="font-black">${g.teams.home.score ?? 0}</span><img src="https://www.mlbstatic.com/team-logos/${g.teams.home.team.id}.svg" class="w-5 h-5"><span class="text-xs font-bold">${TEAM_MAP[g.teams.home.team.id] || '---'}</span></div>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { }
        }

        async function fetchPlayerStats() {
            let bHtml = ''; let pHtml = '';
            for (const p of PLAYERS.batters) { const res = await findStats(p.id, 'batting'); bHtml += renderB(p, res.stats, res.played); }
            for (const p of PLAYERS.pitchers) { const res = await findStats(p.id, 'pitching'); pHtml += renderP(p, res.stats, res.played); }
            document.getElementById('batter-list').innerHTML = bHtml;
            document.getElementById('pitcher-list').innerHTML = pHtml;
        }

        async function findStats(id, type) {
            let combined = null; let played = false;
            for (const pk of dailyGames) {
                try {
                    const res = await fetch(`https://statsapi.mlb.com/api/v1/game/${pk}/boxscore`);
                    const data = await res.json();
                    ['away','home'].forEach(s => {
                        const p = data.teams[s].players[`ID${id}`];
                        if (p?.stats?.[type]) {
                            const st = p.stats[type];
                            const active = type === 'batting' ? (st.atBats > 0 || st.hits > 0) : (st.numberOfPitches > 0);
                            if (active) {
                                played = true;
                                if (!combined) combined = {...st};
                                else Object.keys(st).forEach(k => { if(typeof st[k]==='number') combined[k]=(combined[k]||0)+st[k]; });
                            }
                        }
                    });
                } catch(e){}
            }
            return {stats: combined, played};
        }

        async function fetchSeasonOverview() {
            let html = '';
            for(const p of PLAYERS.batters){ const s = await getS(p.id, 'hitting'); html += renderSeasonCard(p, s, 'hitting'); }
            for(const p of PLAYERS.pitchers){ const s = await getS(p.id, 'pitching'); html += renderSeasonCard(p, s, 'pitching'); }
            document.getElementById('season-stats-list').innerHTML = html;
        }

        async function getS(id, g){
            const res = await fetch(`https://statsapi.mlb.com/api/v1/people/${id}/stats?stats=season&season=2026&group=${g}`);
            const data = await res.json();
            return data.stats?.[0]?.splits?.[0]?.stat;
        }

        async function fetchStandings(){
            const res = await fetch(`https://statsapi.mlb.com/api/v1/standings?leagueId=103,104&season=2026`);
            const data = await res.json();
            standingsData = data.records;
        }

        window.renderLeagueStandings = (lId) => {
            const btnA = document.getElementById('btn-al'); const btnN = document.getElementById('btn-nl');
            btnA.className = lId==='103' ? 'flex-1 py-2 rounded-xl bg-blue-600/20 text-blue-400 text-[10px] font-black border border-blue-500/30' : 'flex-1 py-2 rounded-xl bg-slate-800 text-slate-500 text-[10px] font-black';
            btnN.className = lId==='104' ? 'flex-1 py-2 rounded-xl bg-blue-600/20 text-blue-400 text-[10px] font-black border border-blue-500/30' : 'flex-1 py-2 rounded-xl bg-slate-800 text-slate-500 text-[10px] font-black';
            
            const recs = standingsData.filter(r => r.league.id == lId).map(r => {
                let n = r.division.name; let o = 99;
                if (lId == '103') { if(n.includes('East')){ n='東區'; o=1; } else if(n.includes('Central')){ n='中區'; o=2; } else { n='西區'; o=3; } }
                else { if(n.includes('East')){ n='East'; o=1; } else if(n.includes('Central')){ n='Central'; o=2; } else { n='West'; o=3; } }
                return {...r, n, o};
            }).sort((a,b)=>a.o-b.o);

            document.getElementById('standings-container').innerHTML = recs.map(div => `
                <div class="division-header">${div.n}</div>
                <table class="standing-table">
                    ${div.teamRecords.map((t, i) => `
                        <tr>
                            <td class="w-8 font-black text-slate-600">${i+1}</td>
                            <td class="flex items-center gap-2"><img src="https://www.mlbstatic.com/team-logos/${t.team.id}.svg" class="w-4 h-4"><span class="${PRIORITY_TEAMS.includes(t.team.id)?'text-blue-400 font-black':'text-slate-400'}">${TEAM_MAP[t.team.id]||t.team.name}</span></td>
                            <td class="text-right font-bold text-slate-300">${t.wins}-${t.losses}</td>
                        </tr>
                    `).join('')}
                </table>
            `).join('');
        };

        function renderB(p, s, played) {
            return `<div class="card-dark">
                <div class="flex items-center gap-4 mb-4">
                    <img src="${p.img}" class="w-14 h-14 rounded-full border-2 border-white/10 bg-slate-900">
                    <div class="flex-1 flex justify-between items-start">
                        <div><h3 class="font-black text-base">${p.name}</h3><p class="text-[10px] font-bold text-slate-500 uppercase">${TEAM_MAP[p.teamHint]} · ${p.pos}</p></div>
                        <span class="text-[9px] font-black px-2 py-1 rounded-md ${played?'played-badge':'bg-slate-800 text-slate-600'}">${played?'已上場':'未出賽'}</span>
                    </div>
                </div>
                <div class="stat-grid text-slate-300">
                    <div><span class="text-[8px] text-slate-500 block">AB</span><span class="text-sm font-black">${s?.atBats||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">R</span><span class="text-sm font-black">${s?.runs||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">H</span><span class="text-sm font-black ${s?.hits>0?'text-blue-400':''}">${s?.hits||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">RBI</span><span class="text-sm font-black">${s?.rbi||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">BB</span><span class="text-sm font-black">${s?.baseOnBalls||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">HR</span><span class="text-sm font-black ${s?.homeRuns>0?'text-red-500':''}">${s?.homeRuns||0}</span></div>
                </div>
            </div>`;
        }

        function renderP(p, s, played) {
            return `<div class="card-dark">
                <div class="flex items-center gap-4 mb-4">
                    <img src="${p.img}" class="w-14 h-14 rounded-full border-2 border-white/10 bg-slate-900">
                    <div class="flex-1 flex justify-between items-start">
                        <div><h3 class="font-black text-base">${p.name}</h3><p class="text-[10px] font-bold text-slate-500 uppercase">${TEAM_MAP[p.teamHint]} · P</p></div>
                        <span class="text-[9px] font-black px-2 py-1 rounded-md ${played?'played-badge':'bg-slate-800 text-slate-600'}">${played?'已登板':'未登板'}</span>
                    </div>
                </div>
                <div class="stat-grid text-slate-300">
                    <div><span class="text-[8px] text-emerald-500 block">IP</span><span class="text-sm font-black text-emerald-400">${s?.inningsPitched||'0.0'}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">H</span><span class="text-sm font-black">${s?.hits||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">ER</span><span class="text-sm font-black">${s?.earnedRuns||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">BB</span><span class="text-sm font-black">${s?.baseOnBalls||0}</span></div>
                    <div><span class="text-[8px] text-purple-400 block">K</span><span class="text-sm font-black text-purple-400">${s?.strikeOuts||s?.strikeouts||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">NP</span><span class="text-sm font-black">${s?.numberOfPitches||0}</span></div>
                </div>
            </div>`;
        }

        function renderSeasonCard(p, s, group) {
            let row = group==='hitting' ? `
                <div><span class="text-[8px] text-slate-500 block">AVG</span><span class="text-sm font-black text-emerald-400">${s?.avg||'.000'}</span></div>
                <div><span class="text-[8px] text-slate-500 block">HR</span><span class="text-sm font-black">${s?.homeRuns||0}</span></div>
                <div><span class="text-[8px] text-slate-500 block">RBI</span><span class="text-sm font-black">${s?.rbi||0}</span></div>
                <div><span class="text-[8px] text-slate-500 block">OPS</span><span class="text-sm font-black text-blue-400">${s?.ops||'.000'}</span></div>
                <div><span class="text-[8px] text-slate-500 block">SB</span><span class="text-sm font-black">${s?.stolenBases||0}</span></div>
            ` : `
                <div><span class="text-[8px] text-slate-500 block">W-L</span><span class="text-sm font-black">${s?.wins||0}-${s?.losses||0}</span></div>
                <div><span class="text-[8px] text-slate-500 block">ERA</span><span class="text-sm font-black text-emerald-400">${s?.era||'-.--'}</span></div>
                <div><span class="text-[8px] text-slate-500 block">SO</span><span class="text-sm font-black text-purple-400">${s?.strikeOuts||s?.strikeouts||0}</span></div>
                <div><span class="text-[8px] text-slate-500 block">WHIP</span><span class="text-sm font-black">${s?.whip||'-.--'}</span></div>
                <div><span class="text-[8px] text-slate-500 block">SV</span><span class="text-sm font-black">${s?.saves||0}</span></div>
            `;
            return `<div class="card-dark">
                <div class="flex items-center gap-4 mb-2">
                    <img src="${p.img}" class="w-12 h-12 rounded-full border border-white/10">
                    <div><h3 class="font-black text-sm">${p.name}</h3><p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">SEASON ACCUMULATED</p></div>
                </div>
                <div class="season-stat-grid text-slate-300">${row}</div>
            </div>`;
        }

        window.onload = init;
    </script>
</body>
</html>
