<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- 第一優先級：iOS 獨立 App 宣告 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MLB Monitor">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MLB Gameday Monitor v3.1</title>

    <!-- iOS 圖示 -->
    <link rel="apple-touch-icon" href="https://teamkazu223.github.io/mlb-daily/img/mlb.png">
    
    <!-- 指向您的外部 Manifest 檔案 -->
    <link rel="manifest" href="https://teamkazu223.github.io/mlb-daily/json/manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0a1118;
            --tab-height: 56px; /* v3.1: 縮小頁籤高度 */
            --safe-bottom: env(safe-area-inset-bottom);
            --safe-top: env(safe-area-inset-top);
            --mlb-blue: #3b82f6;
        }
        
        /* 鎖定背景，防止 iOS 橡皮筋回彈 */
        html, body {
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            overscroll-behavior: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
        }

        /* 版本號標記 */
        .version-tag {
            position: absolute;
            top: calc(8px + var(--safe-top));
            left: 15px;
            font-size: 10px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.2);
            z-index: 50;
            pointer-events: none;
        }

        /* 頂部 Header：壓縮高度 */
        header {
            background: linear-gradient(180deg, #141f2a 0%, #0a1118 100%);
            padding-top: calc(0.75rem + var(--safe-top));
            padding-bottom: 0.75rem;
            text-align: center;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 主滾動區域 */
        main {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 0 1rem;
        }

        /* 底部頁籤：壓縮高度並適配 Safe Area */
        .tab-bar {
            flex-shrink: 0;
            height: calc(var(--tab-height) + var(--safe-bottom));
            background: rgba(20, 31, 42, 0.98);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid #2d3d4d;
            display: flex;
            justify-content: space-around;
            padding-bottom: var(--safe-bottom);
            z-index: 1000;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            color: #64748b;
            background: none;
            border: none;
            width: 33.33%;
        }
        .tab-item.active { color: var(--mlb-blue); }
        .tab-item i { font-size: 16px; }
        .tab-item span { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; }

        .card-dark { background-color: #1a2634; border: 1px solid #2d3d4d; border-radius: 1.25rem; padding: 1.25rem; margin-bottom: 1rem; }
        
        /* 選手圖片包裝器 (Silo 風格) */
        .player-img-wrapper {
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            border: 2.5px solid var(--mlb-blue);
            background: #ffffff;
            flex-shrink: 0;
            padding: 0px;
        }
        
        .player-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            transform: scale(1.1); 
            object-position: center center;
        }

        .stat-grid { display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; padding-top: 10px; border-top: 1px solid #2d3d4d; margin-top: 10px; }
        .season-stat-grid { display: grid; grid-template-columns: repeat(5, 1fr); text-align: center; padding-top: 10px; border-top: 1px solid #2d3d4d; margin-top: 10px; }
        
        .schedule-row {
            display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px;
            background: rgba(26, 38, 52, 0.7); border: 1px solid #2d3d4d; margin-bottom: 8px;
        }

        #loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0a1118; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10000;
        }
        .baseball-spinner { width: 44px; height: 44px; background-color: var(--mlb-blue); border-radius: 50%; position: relative; animation: spin 2s linear infinite; }
        .baseball-spinner::before, .baseball-spinner::after { content: ''; position: absolute; width: 34px; height: 34px; border: 3px solid #0a1118; border-radius: 50%; }
        .baseball-spinner::before { top: -20px; left: 4px; }
        .baseball-spinner::after { bottom: -20px; right: -8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { color: #81b3ff; font-weight: 900; font-size: 11px; letter-spacing: 0.2em; margin-top: 16px; }

        /* 分區排名表格樣式 */
        .division-header { 
            background: rgba(255, 255, 255, 0.03); 
            color: #ffffff; 
            font-weight: 900; 
            padding: 12px 14px; 
            border-radius: 8px 8px 0 0; 
            margin: 16px 0 0 0; 
            font-size: 12px; 
            border-bottom: 1px solid #2d3d4d;
        }
        .standing-table { width: 100%; border-collapse: collapse; font-size: 10px; background: rgba(26, 38, 52, 0.2); }
        .standing-table thead th { 
            text-align: right; 
            padding: 8px 4px; 
            color: #64748b; 
            font-weight: 900; 
            border-bottom: 1px solid #2d3d4d;
        }
        .standing-table thead th:first-child, .standing-table tbody td:first-child { text-align: left; padding-left: 12px; }
        .standing-table tbody td { padding: 12px 4px; border-bottom: 1px solid #1e293b; text-align: right; color: #cbd5e1; }
        .standing-table tbody td:first-child { text-align: left; }
        .standing-table .team-name { font-weight: 700; color: #ffffff; }
        .standing-table .team-name.highlight { color: var(--mlb-blue); }
        .standing-table .stat-bold { font-weight: 900; color: #ffffff; }

        .bottom-spacer { height: 40px; }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="baseball-spinner"></div>
        <p class="loader-text">SYNCING MLB DATA...</p>
    </div>

    <div class="version-tag">v3.1</div>

    <header>
        <div class="flex justify-center mb-4">
            <img src="https://www.mlbstatic.com/team-logos/league-on-dark/1.svg" class="h-8" alt="MLB">
        </div>
        <div id="header-controls" class="px-4">
            <div class="flex gap-2">
                <input type="date" id="target-date" class="flex-1 bg-[#1a2634] border border-white/10 rounded-2xl p-3.5 text-white text-sm font-bold outline-none" onchange="handleDateChange()">
                <button onclick="handleManualRefresh()" class="w-14 bg-[#1a2634] border border-white/10 rounded-2xl flex items-center justify-center active:scale-90">
                    <i class="fas fa-sync-alt text-base text-blue-400"></i>
                </button>
            </div>
        </div>
        <div id="header-season-title" class="hidden py-1.5 text-blue-400 font-black uppercase text-sm tracking-tighter">Season Stats 2026</div>
        <div id="header-starter-title" class="hidden py-1.5 text-emerald-400 font-black uppercase text-sm tracking-tighter">Probable Starters</div>
    </header>

    <main id="scroll-area">
        <!-- 頁籤 1: 今日戰況 -->
        <div id="tab-content-daily">
            <section class="mt-4 mb-8">
                <h2 class="font-black text-[11px] tracking-widest uppercase mb-3 text-slate-500">Schedule 重點賽程</h2>
                <div id="schedule-list" class="space-y-2"></div>
            </section>
            <section class="mb-8">
                <h2 class="font-black text-[11px] tracking-widest uppercase mb-3 text-slate-500">Batters 打者成績</h2>
                <div id="batter-list" class="space-y-4"></div>
            </section>
            <section class="mb-8">
                <h2 class="font-black text-[11px] tracking-widest uppercase mb-3 text-slate-500">Pitchers 投手成績</h2>
                <div id="pitcher-list" class="space-y-4"></div>
            </section>
            <div class="bottom-spacer"></div>
        </div>

        <!-- 頁籤 2: 賽季累積 -->
        <div id="tab-content-season" class="hidden">
            <section class="mt-4 mb-8">
                <h2 class="font-black text-[11px] tracking-widest uppercase mb-3 text-blue-400">Accumulated 賽季累積</h2>
                <div id="season-stats-list" class="space-y-4"></div>
            </section>
            <section class="mb-8">
                <h2 class="font-black text-[11px] tracking-widest uppercase mb-3 text-slate-500">Standings 分區排名</h2>
                <div class="card-dark overflow-hidden p-0 bg-transparent border-none">
                    <div class="flex gap-2 mb-3 px-1">
                        <button onclick="renderLeagueStandings('103')" id="btn-al" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-500 text-[10px] font-black tracking-widest">美國聯盟</button>
                        <button onclick="renderLeagueStandings('104')" id="btn-nl" class="flex-1 py-1.5 rounded-lg bg-blue-600/20 text-blue-400 text-[10px] font-black border border-blue-500/30">國家聯盟</button>
                    </div>
                    <div id="standings-container"></div>
                </div>
            </section>
            <div class="bottom-spacer"></div>
        </div>

        <!-- 頁籤 3: 先發預告 -->
        <div id="tab-content-starters" class="hidden">
            <section class="mt-4 mb-8">
                <h2 class="font-black text-[11px] tracking-widest uppercase mb-3 text-emerald-400">Upcoming 先發預告</h2>
                <div id="starters-list" class="space-y-4"></div>
            </section>
            <div class="bottom-spacer"></div>
        </div>
    </main>

    <nav class="tab-bar">
        <button onclick="switchTab('daily')" id="nav-daily" class="tab-item active">
            <i class="fas fa-baseball-bat-ball"></i>
            <span>Daily</span>
        </button>
        <button onclick="switchTab('season')" id="nav-season" class="tab-item">
            <i class="fas fa-chart-line"></i>
            <span>Season</span>
        </button>
        <button onclick="switchTab('starters')" id="nav-starters" class="tab-item">
            <i class="fas fa-calendar-alt"></i>
            <span>Starters</span>
        </button>
    </nav>

    <script>
        const SCHEDULE_FILTER_TEAMS = [119, 117, 116];
        const PRIORITY_TEAMS = [119, 117, 116, 137]; 
        const PLAYERS = {
            batters: [
                { id: 660271, name: '大谷翔平', teamHint: 119, pos: 'DH', img: 'https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:silo:current.png/r_max/w_180,q_auto:best/v1/people/660271/headshot/silo/current' },
                { id: 701678, name: '李灝宇', teamHint: 116, pos: '2B', img: 'https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:silo:current.png/r_max/w_180,q_auto:best/v1/people/701678/headshot/silo/current' }
            ],
            pitchers: [
                { id: 660271, name: '大谷翔平', teamHint: 119, img: 'https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:silo:current.png/r_max/w_180,q_auto:best/v1/people/660271/headshot/silo/current' },
                { id: 808967, name: '山本由伸', teamHint: 119, img: 'https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:silo:current.png/r_max/w_180,q_auto:best/v1/people/660271/headshot/silo/current' },
                { id: 678906, name: '鄧愷威', teamHint: 117, img: 'https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:silo:current.png/r_max/w_180,q_auto:best/v1/people/678906/headshot/silo/current' }
            ]
        };
        const TEAM_MAP = { 
            108: '天使', 109: '響尾蛇', 110: '金鶯', 111: '紅襪', 112: '小熊', 113: '紅人', 114: '守護者', 115: '落磯', 116: '老虎', 117: '太空人', 118: '皇家', 119: '道奇', 120: '國民', 121: '大都會', 133: '運動家', 134: '海盜', 135: '教士', 136: '水手', 137: '巨人', 138: '紅雀', 139: '光芒', 140: '遊騎兵', 141: '藍鳥', 142: '雙城', 143: '費城人', 144: '勇士', 145: '白襪', 146: '馬林魚', 147: '洋基', 158: '釀酒人' 
        };

        let dailyGames = []; let currentTab = 'daily'; let seasonDataLoaded = false; let startersDataLoaded = false; let standingsData = null;

        function init() {
            const now = new Date();
            const today = now.toISOString().split('T')[0];
            document.getElementById('target-date').value = today;
            fetchDailyData();
        }

        async function switchTab(tabName) {
            if (currentTab === tabName) return;
            currentTab = tabName;
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${tabName}`).classList.add('active');
            document.getElementById('tab-content-daily').classList.toggle('hidden', tabName !== 'daily');
            document.getElementById('tab-content-season').classList.toggle('hidden', tabName !== 'season');
            document.getElementById('tab-content-starters').classList.toggle('hidden', tabName !== 'starters');
            document.getElementById('header-controls').classList.toggle('hidden', tabName !== 'daily');
            document.getElementById('header-season-title').classList.toggle('hidden', tabName !== 'season');
            document.getElementById('header-starter-title').classList.toggle('hidden', tabName !== 'starters');
            if (tabName === 'season' && !seasonDataLoaded) await fetchSeasonData();
            if (tabName === 'starters' && !startersDataLoaded) await fetchStartersData();
            document.getElementById('scroll-area').scrollTop = 0;
        }

        function toggleLoader(show) {
            const loader = document.getElementById('loader-overlay');
            loader.style.display = show ? 'flex' : 'none';
        }

        async function fetchDailyData() {
            toggleLoader(true);
            const date = document.getElementById('target-date').value;
            try {
                await fetchSchedule(date);
                await fetchPlayerStats();
            } catch (e) { console.error(e); }
            finally { setTimeout(() => toggleLoader(false), 500); }
        }

        async function fetchSeasonData() {
            toggleLoader(true);
            try {
                await Promise.all([fetchSeasonOverview(), fetchStandings()]);
                seasonDataLoaded = true;
                renderLeagueStandings('104'); 
            } catch (e) { console.error(e); }
            finally { toggleLoader(false); }
        }

        async function fetchStartersData() {
            toggleLoader(true);
            const startersList = document.getElementById('starters-list');
            try {
                const today = new Date();
                const futureDate = new Date();
                futureDate.setDate(today.getDate() + 5);
                const startStr = today.toISOString().split('T')[0];
                const endStr = futureDate.toISOString().split('T')[0];
                const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=${startStr}&endDate=${endStr}&hydrate=probablePitcher(note),team`);
                const data = await res.json();
                let html = '';
                if (!data.dates || data.dates.length === 0) {
                    html = '<div class="text-slate-600 text-xs text-center py-8">目前無先發預告資訊</div>';
                } else {
                    data.dates.forEach(dateObj => {
                        const dateStr = new Date(dateObj.date).toLocaleDateString('zh-TW', { month: 'short', day: 'numeric', weekday: 'short' });
                        const games = dateObj.games.filter(g => SCHEDULE_FILTER_TEAMS.includes(g.teams.away.team.id) || SCHEDULE_FILTER_TEAMS.includes(g.teams.home.team.id));
                        if (games.length > 0) {
                            html += `<div class="mb-4"><h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 pl-1">${dateStr}</h3>`;
                            games.forEach(g => { html += renderStarterGameCard(g); });
                            html += `</div>`;
                        }
                    });
                }
                startersList.innerHTML = html || '<div class="text-slate-600 text-xs text-center py-8">未來5日無重點球隊賽程</div>';
                startersDataLoaded = true;
            } catch (e) { 
                console.error(e);
                startersList.innerHTML = '<div class="text-red-500 text-xs text-center py-8">無法載入預告數據</div>';
            } finally { toggleLoader(false); }
        }

        function renderStarterGameCard(g) {
            const time = new Date(g.gameDate).toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', timeZone: 'America/New_York' });
            const away = g.teams.away;
            const home = g.teams.home;
            const renderPitcherInfo = (team) => {
                const p = team.probablePitcher;
                const pName = p ? p.fullName : "尚未公佈 TBD";
                const pId = p ? p.id : null;
                const pImg = pId ? `https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:silo:current.png/r_max/w_180,q_auto:best/v1/people/${pId}/headshot/silo/current` : 'https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:silo:current.png/r_max/w_180,q_auto:best/v1/people/generic/headshot/silo/current';
                return `
                    <div class="flex flex-col items-center gap-2 w-[45%]">
                        <div class="player-img-wrapper" style="width: 72px; height: 72px;">
                            <img src="${pImg}">
                        </div>
                        <div class="text-center">
                            <p class="text-[10px] font-black text-blue-400 uppercase mb-0.5 tracking-tight">${TEAM_MAP[team.team.id] || team.team.name}</p>
                            <p class="text-[11px] font-black leading-tight truncate w-24">${pName}</p>
                        </div>
                    </div>
                `;
            };
            return `
                <div class="card-dark py-4 px-3">
                    <div class="flex justify-between items-center mb-4 px-1">
                        <span class="text-[9px] font-black text-emerald-400 bg-emerald-400/10 px-2 py-0.5 rounded border border-emerald-400/20">${time} ET</span>
                        <span class="text-[8px] font-bold text-slate-500 uppercase tracking-tighter truncate max-w-[120px]">${g.venue.name}</span>
                    </div>
                    <div class="flex items-start justify-between">
                        ${renderPitcherInfo(away)}
                        <div class="pt-5 text-slate-700 font-black text-xs">VS</div>
                        ${renderPitcherInfo(home)}
                    </div>
                </div>
            `;
        }

        async function fetchSchedule(date) {
            try {
                const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${date}&hydrate=linescore`);
                const data = await res.json();
                const list = document.getElementById('schedule-list');
                dailyGames = [];
                if (!data.dates?.[0]) { list.innerHTML = `<div class="text-slate-600 text-xs text-center py-4">本日無賽程</div>`; return; }
                const games = data.dates[0].games;
                games.forEach(g => dailyGames.push(g.gamePk));
                const filtered = games.filter(g => SCHEDULE_FILTER_TEAMS.includes(g.teams.away.team.id) || SCHEDULE_FILTER_TEAMS.includes(g.teams.home.team.id));
                list.innerHTML = filtered.map(g => {
                    const status = g.status.abstractGameState;
                    const time = new Date(g.gameDate).toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', timeZone: 'America/New_York' });
                    let sub = status;
                    if (status === 'Live' && g.linescore) sub = `<span class="text-red-500 font-bold">${g.linescore.inningState || ""} ${g.linescore.currentInningOrdinal || ""}</span>`;
                    return `<div class="schedule-row">
                        <div class="text-[9px] font-black w-10"><div class="text-slate-400">${time}</div><div>${sub}</div></div>
                        <div class="flex-1 flex items-center justify-center gap-2 px-1 overflow-hidden">
                            <div class="flex items-center gap-1 flex-1 justify-end min-w-0"><span class="text-[9px] font-bold truncate">${TEAM_MAP[g.teams.away.team.id] || '---'}</span><img src="https://www.mlbstatic.com/team-logos/${g.teams.away.team.id}.svg" class="w-4 h-4"><span class="font-black text-sm">${g.teams.away.score ?? 0}</span></div>
                            <span class="text-[8px] text-slate-600 flex-shrink-0">vs</span>
                            <div class="flex items-center gap-1 flex-1 justify-start min-w-0"><span class="font-black text-sm">${g.teams.home.score ?? 0}</span><img src="https://www.mlbstatic.com/team-logos/${g.teams.home.team.id}.svg" class="w-4 h-4"><span class="text-[9px] font-bold truncate">${TEAM_MAP[g.teams.home.team.id] || '---'}</span></div>
                        </div>
                        <a href="https://www.mlb.com/gameday/${g.gamePk}" target="_blank" class="w-8 h-8 flex items-center justify-center bg-blue-500/10 rounded-lg text-blue-400 active:scale-95 flex-shrink-0 ml-1">
                            <i class="fas fa-external-link-alt text-[10px]"></i>
                        </a>
                    </div>`;
                }).join('');
            } catch (e) { }
        }

        async function fetchPlayerStats() {
            let bHtml = ''; let pHtml = '';
            for (const p of PLAYERS.batters) { const res = await findStats(p.id, 'batting'); bHtml += renderB(p, res.stats, res.played); }
            for (const p of PLAYERS.pitchers) { const res = await findStats(p.id, 'pitching'); pHtml += renderP(p, res.stats, res.played); }
            document.getElementById('batter-list').innerHTML = bHtml;
            document.getElementById('pitcher-list').innerHTML = pHtml;
        }

        async function findStats(id, type) {
            let combined = null; let played = false;
            for (const pk of dailyGames) {
                try {
                    const res = await fetch(`https://statsapi.mlb.com/api/v1/game/${pk}/boxscore`);
                    const data = await res.json();
                    ['away','home'].forEach(s => {
                        const p = data.teams[s].players[`ID${id}`];
                        if (p?.stats?.[type]) {
                            const st = p.stats[type];
                            const active = type === 'batting' ? (st.atBats > 0 || st.hits > 0) : (st.numberOfPitches > 0);
                            if (active) { played = true; if (!combined) combined = {...st}; else Object.keys(st).forEach(k => { if(typeof st[k]==='number') combined[k]=(combined[k]||0)+st[k]; }); }
                        }
                    });
                } catch(e){}
            }
            return {stats: combined, played};
        }

        async function fetchSeasonOverview() {
            let html = '';
            for(const p of PLAYERS.batters){ const s = await getS(p.id, 'hitting'); html += renderSeasonCard(p, s, 'hitting'); }
            for(const p of PLAYERS.pitchers){ const s = await getS(p.id, 'pitching'); html += renderSeasonCard(p, s, 'pitching'); }
            document.getElementById('season-stats-list').innerHTML = html;
        }

        async function getS(id, g){
            const res = await fetch(`https://statsapi.mlb.com/api/v1/people/${id}/stats?stats=season&season=2026&group=${g}`);
            const data = await res.json();
            return data.stats?.[0]?.splits?.[0]?.stat;
        }

        async function fetchStandings(){
            const res = await fetch(`https://statsapi.mlb.com/api/v1/standings?leagueId=103,104&season=2026`);
            const data = await res.json();
            standingsData = data.records;
        }

        window.renderLeagueStandings = (lId) => {
            const btnA = document.getElementById('btn-al'); const btnN = document.getElementById('btn-nl');
            btnA.className = lId==='103' ? 'flex-1 py-1.5 rounded-lg bg-blue-600/20 text-blue-400 text-[10px] font-black border border-blue-500/30' : 'flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-500 text-[10px] font-black';
            btnN.className = lId==='104' ? 'flex-1 py-1.5 rounded-lg bg-blue-600/20 text-blue-400 text-[10px] font-black border border-blue-500/30' : 'flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-500 text-[10px] font-black';
            const leagueName = lId === '103' ? '美國聯盟' : '國家聯盟';
            
            // v3.1: 修正排序，強制 東區 -> 中區 -> 西區
            const recs = standingsData.filter(r => r.league.id == lId).map(r => {
                let n = r.division?.name || ""; let o = 99;
                if (n.includes('East')){ n=`${leagueName}東區`; o=1; } 
                else if (n.includes('Central')){ n=`${leagueName}中區`; o=2; } 
                else { n=`${leagueName}西區`; o=3; }
                return {...r, n, o};
            }).sort((a,b)=>a.o-b.o);

            document.getElementById('standings-container').innerHTML = recs.map(div => `
                <div class="division-header">${div.n}</div>
                <table class="standing-table">
                    <thead>
                        <tr>
                            <th width="35%">隊伍</th>
                            <th>W</th>
                            <th>L</th>
                            <th>Pct</th>
                            <th>GB</th>
                            <th>Home</th>
                            <th>Away</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${div.teamRecords.map((t, i) => {
                            const isPriority = PRIORITY_TEAMS.includes(t.team.id);
                            const homeRec = t.records.splitRecords.find(s => s.type === 'home');
                            const awayRec = t.records.splitRecords.find(s => s.type === 'away');
                            return `
                                <tr>
                                    <td class="flex items-center gap-2">
                                        <img src="https://www.mlbstatic.com/team-logos/${t.team.id}.svg" class="w-4 h-4">
                                        <span class="team-name ${isPriority?'highlight':''}">${TEAM_MAP[t.team.id]||t.team.name}</span>
                                    </td>
                                    <td class="stat-bold">${t.wins}</td>
                                    <td>${t.losses}</td>
                                    <td class="stat-bold">${t.winningPercentage}</td>
                                    <td>${t.gamesBack === '-' ? '-' : t.gamesBack}</td>
                                    <td>${homeRec ? homeRec.wins+'-'+homeRec.losses : '-'}</td>
                                    <td>${awayRec ? awayRec.wins+'-'+awayRec.losses : '-'}</td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `).join('');
        };

        function renderB(p, s, played) {
            return `<div class="card-dark">
                <div class="flex items-center gap-4 mb-4">
                    <div class="player-img-wrapper" style="width: 64px; height: 64px;"><img src="${p.img}"></div>
                    <div class="flex-1 flex justify-between items-start">
                        <div><h3 class="font-black text-base">${p.name}</h3><p class="text-[10px] font-bold text-slate-500 uppercase">${TEAM_MAP[p.teamHint]} · ${p.pos}</p></div>
                        <span class="text-[9px] font-black px-2 py-1 rounded-md ${played?'played-badge':'bg-slate-800 text-slate-600'}">${played?'已上場':'未出賽'}</span>
                    </div>
                </div>
                <div class="stat-grid text-slate-300">
                    <div><span class="text-[8px] text-slate-500 block">AB</span><span class="text-sm font-black">${s?.atBats||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">R</span><span class="text-sm font-black">${s?.runs||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">H</span><span class="text-sm font-black ${s?.hits>0?'text-blue-400':''}">${s?.hits||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">RBI</span><span class="text-sm font-black">${s?.rbi||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">BB</span><span class="text-sm font-black">${s?.baseOnBalls||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">HR</span><span class="text-sm font-black ${s?.homeRuns>0?'text-red-500':''}">${s?.homeRuns||0}</span></div>
                </div>
            </div>`;
        }

        function renderP(p, s, played) {
            return `<div class="card-dark">
                <div class="flex items-center gap-4 mb-4">
                    <div class="player-img-wrapper" style="width: 64px; height: 64px;"><img src="${p.img}"></div>
                    <div class="flex-1 flex justify-between items-start">
                        <div><h3 class="font-black text-base">${p.name}</h3><p class="text-[10px] font-bold text-slate-500 uppercase">${TEAM_MAP[p.teamHint]} · P</p></div>
                        <span class="text-[9px] font-black px-2 py-1 rounded-md ${played?'played-badge':'bg-slate-800 text-slate-600'}">${played?'已登板':'未登板'}</span>
                    </div>
                </div>
                <div class="stat-grid text-slate-300">
                    <div><span class="text-[8px] text-emerald-500 block">IP</span><span class="text-sm font-black text-emerald-400">${s?.inningsPitched||'0.0'}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">H</span><span class="text-sm font-black">${s?.hits||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">ER</span><span class="text-sm font-black">${s?.earnedRuns||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">BB</span><span class="text-sm font-black">${s?.baseOnBalls||0}</span></div>
                    <div><span class="text-[8px] text-purple-400 block">K</span><span class="text-sm font-black text-purple-400">${s?.strikeOuts||s?.strikeouts||0}</span></div>
                    <div><span class="text-[8px] text-slate-500 block">NP</span><span class="text-sm font-black">${s?.numberOfPitches||0}</span></div>
                </div>
            </div>`;
        }

        function renderSeasonCard(p, s, group) {
            let row = group==='hitting' ? `
                <div><span class="text-[8px] text-slate-500 block">AVG</span><span class="text-sm font-black text-emerald-400">${s?.avg||'.000'}</span></div>
                <div><span class="text-[8px] text-slate-500 block">HR</span><span class="text-sm font-black">${s?.homeRuns||0}</span></div>
                <div><span class="text-[8px] text-slate-500 block">RBI</span><span class="text-sm font-black">${s?.rbi||0}</span></div>
                <div><span class="text-[8px] text-slate-500 block">OPS</span><span class="text-sm font-black text-blue-400">${s?.ops||'.000'}</span></div>
                <div><span class="text-[8px] text-slate-500 block">SB</span><span class="text-sm font-black">${s?.stolenBases||0}</span></div>
            ` : `
                <div><span class="text-[8px] text-slate-500 block">W-L</span><span class="text-sm font-black">${s?.wins||0}-${s?.losses||0}</span></div>
                <div><span class="text-[8px] text-slate-500 block">ERA</span><span class="text-sm font-black text-emerald-400">${s?.era||'-.--'}</span></div>
                <div><span class="text-[8px] text-purple-400 block">SO</span><span class="text-sm font-black text-purple-400">${s?.strikeOuts||s?.strikeouts||0}</span></div>
                <div><span class="text-[8px] text-slate-500 block">WHIP</span><span class="text-sm font-black">${s?.whip||'-.--'}</span></div>
                <div><span class="text-[8px] text-slate-500 block">SV</span><span class="text-sm font-black">${s?.saves||0}</span></div>
            `;
            return `<div class="card-dark">
                <div class="flex items-center gap-4 mb-2">
                    <div class="player-img-wrapper" style="width: 72px; height: 72px;"><img src="${p.img}"></div>
                    <div><h3 class="font-black text-sm">${p.name}</h3><p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">SEASON ACCUMULATED</p></div>
                </div>
                <div class="season-stat-grid text-slate-300">${row}</div>
            </div>`;
        }

        window.onload = init;
    </script>
</body>
</html>
